# 仅用于本机验证镜像，不参与魔搭创空间部署（创空间直接读 Dockerfile）。
#
#   docker compose up --build
#   打开 http://127.0.0.1:7860
#
# data/ 目录是本地挂载，用来保留 SQLite 与上传图；
# 创空间没有持久卷，容器重启后数据会清空（详见 README 的部署章节）。

services:
  recut:
    build: .
    image: recut-agent:local
    ports:
      - "7860:7860"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-qwen-vl-max}
      # 本地是 http，必须关掉 Secure，否则浏览器不会回传 cookie
      APP_COOKIE_SECURE: "false"
      # 首次启动自动建管理员（仅在库中没有用户时生效）
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-admin@example.com}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-ChangeMe-2026}
      APP_DB_URL: sqlite:////data/recut.db
      APP_UPLOAD_DIR: /data/uploads
    volumes:
      - ./data:/data
