[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse-storyboard-mcp"
version = "0.1.0"
description = "Local video shot preparation and evidence-based vision storyboard MCP tools"
requires-python = ">=3.10"
dependencies = ["mcp>=1.12,<2", "pydantic>=2.7,<3", "Pillow>=10,<13", "numpy>=1.26,<3", "imageio-ffmpeg>=0.5,<0.7", "httpx>=0.27,<1"]

[project.scripts]
reverse-storyboard-mcp = "reverse_storyboard.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reverse_storyboard = ["prompts/*.md"]
